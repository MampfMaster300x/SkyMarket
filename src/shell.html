<title>Skymarket</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* SKYMARKET Corporate Design: Nachtblau, leuchtende Strecken, farbcodierte Bereiche (Karte blau, Flotte grün,
   Strecken violett, Finanzen orange, Markt pink, Unternehmen türkis). */
:root {
  --c-karte: #2f7cf6; --c-flotte: #1fa463; --c-strecken: #7c4dff; --c-finanzen: #ef8a17; --c-markt: #e23d7f; --c-unternehmen: #0fa39a;
  --bar: #0b1a33; --bar-2: #10234a; --bar-ink: #e9f0ff; --bar-ink-2: #9db0d6;
  --sea: #d7e4f2; --land: #f4f7fb; --coast: #b8c7da; --border: #c9d6e6; --glow: rgba(47,124,246,.0);
  --bg: #e8eef6; --panel: #ffffff; --panel-glass: rgba(255,255,255,.96); --panel-2: #f1f5fa; --line: #dfe6ef; --line-2: #c9d3e0;
  --ink: #0e1a2d; --ink-2: #44546b; --ink-3: #75849a;
  --accent: #f2b400; --accent-2: #ffc928; --accent-soft: #fff4cf; --accent-ink: #8a6500; --on-accent: #1a1400;
  --plane: #f2b400; --plane-edge: #5a4400; --plane-ai: #8c9db6; --trail: #f2b400;
  --fus: #f8f9fb; --fus-line: #b9c1c9; --glass: #2a3540; --gear: #3a434c; --sky: #e6eef6;
  --good: #16a34a; --good-soft: #e3f5ea; --warn: #b7791f; --warn-soft: #fbf0dc; --crit: #dc3545; --crit-soft: #fbe4e6;
  --ai1: #2f8fa8; --ai2: #c16a2c; --ai3: #6f8a1f; --ai4: #b9902a; --ai5: #5266c4; --ai6: #9a56ad; --ai7: #b8475d; --ai8: #2c7f73; --ai9: #c45a96; --ai10: #7a6bd0; --ai11: #3f8f3f; --ai12: #cc7a00; --ai13: #5a7f9e; --ai14: #a0522d; --ai15: #a35d2a; --ai16: #3d7f8f; --ai17: #b04b4b; --ai18: #8a7a1f; --ai19: #6e5bb5; --ai20: #b5452f; --ai21: #2e8b57; --ai22: #b8860b; --ai23: #4f6fa8; --ai24: #8b3a62; --ai25: #2a7fa0; --ai26: #7d8f2a; --ai27: #b03a3a; --ai28: #2f8a6a; --ai29: #6a4fa8; --ai30: #a8742a;
  --hum1: #8b5cf6; --hum2: #0ea5e9; --hum3: #e2556b; --hum4: #16a34a; --hum5: #d97706; --hum6: #db2777; --hum7: #0d9488; --hum8: #4f46e5;
  --shadow: 0 1px 2px rgba(11,26,51,.06), 0 10px 30px rgba(11,26,51,.10);
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 9px; --r-lg: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bar: #081428; --bar-2: #0d1d3a; --bar-ink: #eaf1ff; --bar-ink-2: #93a6cc;
  --sea: #061021; --land: #12223b; --coast: #1d3558; --border: #20395d; --glow: rgba(64,156,255,.35);
  --bg: #050d1b; --panel: #0c1a30; --panel-glass: rgba(12,26,48,.94); --panel-2: #12233e; --line: #1b2f4f; --line-2: #26406a;
  --ink: #eaf1ff; --ink-2: #a7b8d8; --ink-3: #7286aa;
  --accent: #ffc61a; --accent-2: #ffd54f; --accent-soft: rgba(255,198,26,.14); --accent-ink: #ffd04a; --on-accent: #1a1400;
  --plane: #ffc61a; --plane-edge: #1a1400; --plane-ai: #7f93b8; --trail: #ffc61a;
  --fus: #e9edf1; --fus-line: #6c7884; --glass: #1d252d; --gear: #0f1418; --sky: #10213b;
  --good: #34d399; --good-soft: rgba(52,211,153,.13); --warn: #fbbf24; --warn-soft: rgba(251,191,36,.13); --crit: #fb7185; --crit-soft: rgba(251,113,133,.14);
  --ai1: #4fb3cc; --ai2: #e58f55; --ai3: #a3bf4a; --ai4: #e2bb55; --ai5: #8597f0; --ai6: #c48ad6; --ai7: #ec7a8f; --ai8: #4fc2b0; --ai9: #e889bf; --ai10: #a99cf2; --ai11: #74c874; --ai12: #f0a640; --ai13: #8fb4d4; --ai14: #d4885e; --ai15: #e09a63; --ai16: #6fc1d1; --ai17: #f08a8a; --ai18: #d6c75a; --ai19: #a897ef; --ai20: #f08a6e; --ai21: #6fd19a; --ai22: #e8c15a; --ai23: #8fb0ea; --ai24: #e48ab5; --ai25: #5fb8d8; --ai26: #b8cc5a; --ai27: #f07a7a; --ai28: #5fcfa5; --ai29: #a990e8; --ai30: #e8b060;
  --hum1: #b08cff; --hum2: #38bdf8; --hum3: #ff7a8f; --hum4: #4ade80; --hum5: #fbbf24; --hum6: #f472b6; --hum7: #2dd4bf; --hum8: #818cf8;
  --c-karte: #4c8dff; --c-flotte: #2fcf7f; --c-strecken: #9a6bff; --c-finanzen: #ffa23a; --c-markt: #ff5c9a; --c-unternehmen: #22c7bb;
  --shadow: 0 1px 2px rgba(0,0,0,.45), 0 12px 34px rgba(0,0,0,.45); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bar: #081428; --bar-2: #0d1d3a; --bar-ink: #eaf1ff; --bar-ink-2: #93a6cc;
  --sea: #061021; --land: #12223b; --coast: #1d3558; --border: #20395d; --glow: rgba(64,156,255,.35);
  --bg: #050d1b; --panel: #0c1a30; --panel-glass: rgba(12,26,48,.94); --panel-2: #12233e; --line: #1b2f4f; --line-2: #26406a;
  --ink: #eaf1ff; --ink-2: #a7b8d8; --ink-3: #7286aa;
  --accent: #ffc61a; --accent-2: #ffd54f; --accent-soft: rgba(255,198,26,.14); --accent-ink: #ffd04a; --on-accent: #1a1400;
  --plane: #ffc61a; --plane-edge: #1a1400; --plane-ai: #7f93b8; --trail: #ffc61a;
  --fus: #e9edf1; --fus-line: #6c7884; --glass: #1d252d; --gear: #0f1418; --sky: #10213b;
  --good: #34d399; --good-soft: rgba(52,211,153,.13); --warn: #fbbf24; --warn-soft: rgba(251,191,36,.13); --crit: #fb7185; --crit-soft: rgba(251,113,133,.14);
  --ai1: #4fb3cc; --ai2: #e58f55; --ai3: #a3bf4a; --ai4: #e2bb55; --ai5: #8597f0; --ai6: #c48ad6; --ai7: #ec7a8f; --ai8: #4fc2b0; --ai9: #e889bf; --ai10: #a99cf2; --ai11: #74c874; --ai12: #f0a640; --ai13: #8fb4d4; --ai14: #d4885e; --ai15: #e09a63; --ai16: #6fc1d1; --ai17: #f08a8a; --ai18: #d6c75a; --ai19: #a897ef; --ai20: #f08a6e; --ai21: #6fd19a; --ai22: #e8c15a; --ai23: #8fb0ea; --ai24: #e48ab5; --ai25: #5fb8d8; --ai26: #b8cc5a; --ai27: #f07a7a; --ai28: #5fcfa5; --ai29: #a990e8; --ai30: #e8b060;
  --hum1: #b08cff; --hum2: #38bdf8; --hum3: #ff7a8f; --hum4: #4ade80; --hum5: #fbbf24; --hum6: #f472b6; --hum7: #2dd4bf; --hum8: #818cf8;
  --c-karte: #4c8dff; --c-flotte: #2fcf7f; --c-strecken: #9a6bff; --c-finanzen: #ffa23a; --c-markt: #ff5c9a; --c-unternehmen: #22c7bb;
  --shadow: 0 1px 2px rgba(0,0,0,.45), 0 12px 34px rgba(0,0,0,.45); color-scheme: dark; }

html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13.5px/1.45 var(--f-body); overflow: hidden; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent-ink); text-decoration: none; font-weight: 500; } a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--c-karte); outline-offset: 2px; }
.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
svg.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Rahmen ---------- */
#app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
header.top { display: flex; align-items: stretch; gap: 0; min-height: 60px; background: linear-gradient(180deg, var(--bar-2), var(--bar)); color: var(--bar-ink);
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); position: relative; z-index: 6; border-bottom: 1px solid rgba(120,160,230,.14); }
.logo { display: flex; align-items: center; gap: 10px; padding-right: 22px; min-width: 0; }
.logo svg { width: 34px; height: 34px; flex: none; }
.logo .wm { display: grid; line-height: 1.05; }
.logo .wm b { font: 800 19px/1 var(--f-body); letter-spacing: .14em; }
.logo .wm span { font-size: 10.5px; color: var(--bar-ink-2); letter-spacing: .06em; margin-top: 3px; }
nav.main { display: flex; align-items: stretch; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; height: 54px; flex: none;
  background: linear-gradient(180deg, var(--bar-2), var(--bar)); border-radius: var(--r-lg); border: 1px solid rgba(120,160,230,.14); box-shadow: var(--shadow); padding: 0 4px; }
nav.main::-webkit-scrollbar { display: none; }
nav.main button { flex: 1 1 auto; justify-content: center; border: 0; background: transparent; color: var(--bar-ink-2); display: flex; align-items: center; gap: 7px; padding: 0 10px; font: 500 13.5px var(--f-body); white-space: nowrap; position: relative; }
nav.main button:hover { color: var(--bar-ink); background: rgba(255,255,255,.04); }
nav.main button[aria-selected="true"] { color: #fff; background: linear-gradient(180deg, color-mix(in srgb, var(--sc) 30%, transparent), color-mix(in srgb, var(--sc) 8%, transparent)); }
nav.main button[aria-selected="true"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--sc); }
nav.main button .ic { color: var(--sc); width: 21px; height: 21px; stroke-width: 2.1; box-sizing: content-box; padding: 6px; border-radius: 10px;
  background: color-mix(in srgb, var(--sc) 22%, transparent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--sc) 45%, transparent), 0 0 14px color-mix(in srgb, var(--sc) 35%, transparent); transition: background .15s, transform .15s; }
nav.main button:hover .ic { background: color-mix(in srgb, var(--sc) 36%, transparent); transform: translateY(-1px); }
nav.main button[aria-selected="true"] .ic { background: var(--sc); color: #fff; box-shadow: 0 0 16px color-mix(in srgb, var(--sc) 60%, transparent); }
nav.main .dot { position: absolute; top: 8px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: #fb7185; }
.topright { margin-left: auto; display: flex; align-items: center; gap: 14px; padding-left: 14px; }
.date { text-align: right; line-height: 1.15; }
.date b { display: block; font: 600 13px var(--f-body); }
.date span { font: 600 18px var(--f-mono); letter-spacing: .02em; }
.date small { display: block; font-size: 10.5px; color: var(--bar-ink-2); }
.date .d-date { display: none; }
.date small span { font: inherit; letter-spacing: normal; }
.speed { display: inline-flex; align-items: center; gap: 4px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08); border-radius: 999px; padding: 3px; }
.speed button { border: 0; background: transparent; color: var(--bar-ink-2); width: 30px; height: 28px; border-radius: 999px; display: grid; place-items: center; }
.speed button:hover { color: #fff; }
.speed button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.speed select { border: 0; background: transparent; color: var(--bar-ink); font: 600 12px var(--f-body); padding: 4px 6px; border-radius: 999px; max-width: 122px; }
.speed select option { color: #0e1a2d; }
.speed button:disabled, .speed select:disabled { opacity: .55; cursor: not-allowed; }
.iconbtn { border: 0; background: rgba(255,255,255,.06); color: var(--bar-ink); width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; position: relative; }
.iconbtn:hover { background: rgba(255,255,255,.12); }
.iconbtn .dot { position: absolute; top: 6px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: #fb7185; border: 2px solid var(--bar); }
.avatar-btn { border: 0; width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #22d3ee, #2f7cf6); color: #04122a; font: 800 13px var(--f-body); }
.usermenu { position: absolute; right: 12px; top: 58px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 6px; display: grid; min-width: 200px; z-index: 20; }
.usermenu button { border: 0; background: transparent; text-align: left; padding: 9px 12px; border-radius: 8px; font-size: 13px; }
.usermenu button:hover { background: var(--panel-2); }
.usermenu .sep { height: 1px; background: var(--line); margin: 4px 6px; }

main.body { display: grid; grid-template-columns: 300px minmax(0, 1fr) var(--rw, 520px); gap: 12px; padding: 12px; min-height: 0; }
.rcol { position: relative; display: flex; flex-direction: column; gap: 8px; min-height: 0; min-width: 0; container-type: inline-size; }
.rcol > .side { flex: 1 1 auto; }
.resizer { position: absolute; left: -12px; top: 0; bottom: 0; width: 12px; cursor: col-resize; z-index: 5; touch-action: none; }
.resizer::after { content: ""; position: absolute; left: 4px; top: 50%; width: 4px; height: 44px; margin-top: -22px; border-radius: 3px; background: var(--line-2, var(--line)); opacity: .7; transition: opacity .15s, background .15s; }
.resizer:hover::after, .resizer.drag::after, .resizer:focus-visible::after { opacity: 1; background: var(--accent); }
body.resizing { cursor: col-resize; user-select: none; }
body.resizing #map { pointer-events: none; }
@container (max-width: 600px) { nav.main button span.lbl { display: none; } nav.main button[aria-selected="true"] span.lbl { display: inline; } }
.card2 { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); }
#sidebar { display: grid; gap: 12px; align-content: start; overflow-y: auto; min-height: 0; scrollbar-width: thin; }
.alcard { padding: 14px; display: flex; gap: 12px; align-items: center; }
.albadge { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font: 800 16px var(--f-body); color: var(--on-accent); background: linear-gradient(135deg, var(--accent-2), var(--accent)); flex: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.alcard b { display: block; font-size: 15.5px; }
.alcard span { font-size: 12px; color: var(--ink-3); }
.kpilist { display: grid; }
.kpilist > div { padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; border-bottom: 1px solid var(--line); }
.kpilist > div:last-child { border-bottom: 0; }
.kpilist span { font-size: 12px; color: var(--ink-3); }
.kpilist b { font: 600 17px var(--f-mono); grid-column: 1; }
.kpilist em { grid-column: 2; grid-row: 1 / span 2; align-self: center; font: 600 12px var(--f-mono); font-style: normal; }
.kpilist em.up { color: var(--good); } .kpilist em.down { color: var(--crit); }
.assist { padding: 14px; display: grid; gap: 10px; }
.assist-h { display: flex; gap: 10px; align-items: center; }
.assist-h .av { width: 42px; height: 42px; flex: none; }
.assist-h b { display: block; font-size: 14px; } .assist-h span { font-size: 11.5px; color: var(--ink-3); }
.hints { display: grid; gap: 8px; }
.hint { display: grid; grid-template-columns: 10px 1fr; gap: 9px; font-size: 12.5px; line-height: 1.45; color: var(--ink-2); }
.hint i { width: 9px; height: 9px; border-radius: 50%; margin-top: 5px; background: var(--c-karte); box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 0%, transparent); }
.hint.crit i { background: var(--crit); } .hint.warn i { background: var(--warn); } .hint.good i { background: var(--good); } .hint.info i { background: var(--c-karte); }
.hint b { color: var(--ink); font-weight: 600; }
.hint button { margin-top: 4px; }

.mapwrap { position: relative; background: var(--sea); overflow: hidden; border-radius: var(--r-lg); border: 1px solid var(--line); box-shadow: var(--shadow); min-height: 0; }
.mapwrap svg#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.side { --sec: var(--c-karte); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); display: grid; grid-template-rows: auto auto 1fr; min-height: 0; overflow: hidden; }
.side[data-sec="flotte"] { --sec: var(--c-flotte); } .side[data-sec="strecken"] { --sec: var(--c-strecken); } .side[data-sec="finanzen"] { --sec: var(--c-finanzen); }
.side[data-sec="markt"] { --sec: var(--c-markt); } .side[data-sec="unternehmen"] { --sec: var(--c-unternehmen); }
.sechead { display: flex; align-items: center; gap: 12px; padding: 14px 16px 12px; background: linear-gradient(120deg, color-mix(in srgb, var(--sec) 26%, transparent), transparent 75%); border-bottom: 1px solid var(--line); }
.sechead .secic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--sec); color: #fff; flex: none; box-shadow: 0 6px 18px color-mix(in srgb, var(--sec) 40%, transparent); }
.sechead .secic svg.ic { width: 21px; height: 21px; }
.sechead b { display: block; font-size: 16px; } .sechead span { font-size: 12px; color: var(--ink-3); }
nav.tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
nav.tabs button { border: 1px solid transparent; background: transparent; padding: 6px 12px; font: 500 12.5px/1 var(--f-body); color: var(--ink-2); border-radius: 999px; position: relative; white-space: nowrap; }
nav.tabs button:hover { background: color-mix(in srgb, var(--sec) 10%, transparent); color: var(--ink); }
nav.tabs button[aria-selected="true"] { background: var(--sec); color: #fff; }
nav.tabs .dot { position: absolute; top: 1px; right: 1px; width: 7px; height: 7px; border-radius: 50%; background: var(--crit); }
.pane { overflow-y: auto; min-height: 0; padding: 16px 18px 40px; display: grid; gap: 18px; align-content: start; grid-auto-rows: max-content; scrollbar-width: thin; }
.pane > * { min-width: 0; }
.side .btn.primary { background: var(--sec); border-color: var(--sec); color: #fff; }
.side .btn.primary:hover { filter: brightness(1.08); }
.side h2.sec::before { content: ""; display: inline-block; width: 4px; height: 15px; border-radius: 2px; background: var(--sec); margin-right: 8px; vertical-align: -2px; }
.side .tile { border-top: 3px solid color-mix(in srgb, var(--sec) 55%, transparent); }
.only-narrow { display: none; }

@media (max-width: 1280px) {
  main.body { grid-template-columns: minmax(0, 1fr) var(--rw, 480px); }
  #sidebar { display: none; }
  .only-narrow { display: grid; }
}
@media (max-width: 900px) {
  body { overflow: auto; }
  #app { height: auto; min-height: 100%; }
  header.top { flex-wrap: wrap; padding-top: 8px; }
  .logo { padding-right: 10px; }
  .logo .wm span { display: none; }
  .topright { gap: 8px; }
  main.body { grid-template-columns: 1fr; padding: 8px; }
  .resizer { display: none; }
  nav.main { position: sticky; top: 0; z-index: 4; }
  .mapwrap { height: 48vh; min-height: 300px; }
  .pane { overflow: visible; }
  .side { overflow: visible; }
  .date b { display: none; }
  .date .d-day { display: none; } .date .d-date { display: inline; }
}
@media (max-width: 600px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid3 { grid-template-columns: 1fr; }
  .specs { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .speed select { max-width: 92px; }
  .logo .wm b { font-size: 16px; }
  .map-legend, .activebox { display: none; }
  .plane-card .acv { display: none; }
}

/* ---------- Karte ---------- */
.land { fill: var(--land); stroke: var(--coast); stroke-width: .6; vector-effect: non-scaling-stroke; }
.borders { fill: none; stroke: var(--border); stroke-width: .6; opacity: .9; vector-effect: non-scaling-stroke; }
#map { touch-action: none; cursor: grab; } #map:active { cursor: grabbing; }
.rt, .trail { vector-effect: non-scaling-stroke; fill: none; stroke-linecap: round; }
.rt.ai { stroke-width: 1; opacity: .3; }
.rt.meglow { stroke: var(--accent); stroke-width: 6; opacity: .14; }
.rt.me { stroke: var(--accent); stroke-width: 1.6; opacity: .85; }
.rt.me.wait { stroke-dasharray: 4 5; opacity: .55; }
.rt.huglow { stroke-width: 6; opacity: .12; }
.rt.hu { stroke-width: 1.5; opacity: .8; }

/* Marktplatz */
