<title>Skymarket</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Live-Tracking-Optik: Vollbild-Karte, ruhige Flächen, gelbe Flugzeuge, schwebende Panels. */
:root {
  --sea: #cfdde6; --land: #f1f1ec; --coast: #c6c9c2; --border: #d3d5ce;
  --bg: #e9edf0; --panel: #ffffff; --panel-glass: rgba(255,255,255,.95); --panel-2: #f2f4f6; --line: #e3e7eb; --line-2: #cfd5db;
  --ink: #161b21; --ink-2: #4b5560; --ink-3: #7c8792;
  --accent: #f2b400; --accent-2: #ffc928; --accent-soft: #fff4cf; --accent-ink: #8a6500; --on-accent: #1a1400;
  --plane: #f2b400; --plane-edge: #5a4400; --plane-ai: #8f9aa5; --trail: #f2b400;
  --fus: #f8f9fb; --fus-line: #b9c1c9; --glass: #2a3540; --gear: #3a434c; --sky: #e6eef4;
  --good: #1f9d63; --good-soft: #e1f4ea; --warn: #b7791f; --warn-soft: #fbf0dc; --crit: #d63c3c; --crit-soft: #fbe3e3;
  --ai1: #2f8fa8; --ai2: #c16a2c; --ai3: #6f8a1f; --ai4: #b9902a; --ai5: #5266c4; --ai6: #9a56ad; --ai7: #b8475d; --ai8: #2c7f73; --ai9: #c45a96; --ai10: #7a6bd0; --ai11: #3f8f3f; --ai12: #cc7a00; --ai13: #5a7f9e; --ai14: #a0522d; --hum1: #8b5cf6; --hum2: #1e9bd7; --hum3: #e2556b; --hum4: #2fae6a;
  --shadow: 0 1px 2px rgba(16,24,32,.08), 0 8px 28px rgba(16,24,32,.12);
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 8px; --r-lg: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --sea: #1a2128; --land: #283038; --coast: #37414b; --border: #3c4752;
  --bg: #12171c; --panel: #1b2128; --panel-glass: rgba(24,30,36,.95); --panel-2: #232a32; --line: #2c343d; --line-2: #3a434d;
  --ink: #eef2f5; --ink-2: #aab4be; --ink-3: #78848f;
  --accent: #ffc61a; --accent-2: #ffd54f; --accent-soft: rgba(255,198,26,.13); --accent-ink: #ffcf40; --on-accent: #1a1400;
  --plane: #ffc61a; --plane-edge: #1a1400; --plane-ai: #9aa5b1; --trail: #ffc61a;
  --fus: #e9edf1; --fus-line: #6c7884; --glass: #1d252d; --gear: #0f1418; --sky: #222a32;
  --good: #3ecf8e; --good-soft: rgba(62,207,142,.12); --warn: #f5a524; --warn-soft: rgba(245,165,36,.13); --crit: #ff6b6b; --crit-soft: rgba(255,107,107,.13);
  --ai1: #4fb3cc; --ai2: #e58f55; --ai3: #a3bf4a; --ai4: #e2bb55; --ai5: #8597f0; --ai6: #c48ad6; --ai7: #ec7a8f; --ai8: #4fc2b0; --ai9: #e889bf; --ai10: #a99cf2; --ai11: #74c874; --ai12: #f0a640; --ai13: #8fb4d4; --ai14: #d4885e; --hum1: #b08cff; --hum2: #4cc3ff; --hum3: #ff7a8f; --hum4: #4fd68c;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 32px rgba(0,0,0,.45); color-scheme: dark; } }
:root[data-theme="dark"] {
  --sea: #1a2128; --land: #283038; --coast: #37414b; --border: #3c4752;
  --bg: #12171c; --panel: #1b2128; --panel-glass: rgba(24,30,36,.95); --panel-2: #232a32; --line: #2c343d; --line-2: #3a434d;
  --ink: #eef2f5; --ink-2: #aab4be; --ink-3: #78848f;
  --accent: #ffc61a; --accent-2: #ffd54f; --accent-soft: rgba(255,198,26,.13); --accent-ink: #ffcf40; --on-accent: #1a1400;
  --plane: #ffc61a; --plane-edge: #1a1400; --plane-ai: #9aa5b1; --trail: #ffc61a;
  --fus: #e9edf1; --fus-line: #6c7884; --glass: #1d252d; --gear: #0f1418; --sky: #222a32;
  --good: #3ecf8e; --good-soft: rgba(62,207,142,.12); --warn: #f5a524; --warn-soft: rgba(245,165,36,.13); --crit: #ff6b6b; --crit-soft: rgba(255,107,107,.13);
  --ai1: #4fb3cc; --ai2: #e58f55; --ai3: #a3bf4a; --ai4: #e2bb55; --ai5: #8597f0; --ai6: #c48ad6; --ai7: #ec7a8f; --ai8: #4fc2b0; --ai9: #e889bf; --ai10: #a99cf2; --ai11: #74c874; --ai12: #f0a640; --ai13: #8fb4d4; --ai14: #d4885e; --hum1: #b08cff; --hum2: #4cc3ff; --hum3: #ff7a8f; --hum4: #4fd68c;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 32px rgba(0,0,0,.45); color-scheme: dark; }

html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13.5px/1.45 var(--f-body); overflow: hidden; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent-ink); text-decoration: none; font-weight: 500; } a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* ---------- Rahmen ---------- */
#app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
header.top { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding-block: 8px; min-height: 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line); position: relative; z-index: 5; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.tail { width: 32px; height: 32px; border-radius: 8px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center;
  font: 700 14px/1 var(--f-body); letter-spacing: .02em; flex: none; }
.brand-name { font: 600 15px/1.1 var(--f-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
.brand-sub { font-size: 11px; color: var(--ink-3); }
.clock { display: flex; align-items: center; gap: 12px; }
.date { font: 600 14px/1.15 var(--f-body); min-width: 128px; }
.date small { display: block; font: 400 11px/1.3 var(--f-body); color: var(--ink-3); }
.speed { display: inline-flex; background: var(--panel-2); border-radius: 999px; padding: 3px; gap: 2px; }
.speed button { border: 0; background: transparent; padding: 5px 10px; font: 600 12px/1 var(--f-mono); color: var(--ink-2); min-width: 36px; border-radius: 999px; }
.speed button:hover { color: var(--ink); }
.speed button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.speed button:disabled { cursor: not-allowed; opacity: .6; } .speed button[aria-pressed="true"]:disabled { opacity: 1; }
.kpis { display: flex; gap: 22px; margin-left: auto; flex-wrap: wrap; }
.kpi { display: grid; gap: 1px; }
.kpi b { font: 500 14px/1.15 var(--f-mono); font-variant-numeric: tabular-nums; }
.kpi span { font-size: 10.5px; color: var(--ink-3); }
.kpi b.neg { color: var(--crit); } .kpi b.pos { color: var(--good); }
.hdr-actions { display: flex; gap: 6px; }
.icon-btn { border: 1px solid var(--line-2); background: transparent; border-radius: 999px; padding: 6px 12px; font-size: 12px; color: var(--ink-2); }
.icon-btn:hover { border-color: var(--ink-3); color: var(--ink); }

main.body { position: relative; min-height: 0; }
.mapwrap { position: absolute; inset: 0; background: var(--sea); overflow: hidden; }
.mapwrap svg#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.callout .btn { justify-self: start; }
.side { position: absolute; top: 12px; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 12px; width: 480px; z-index: 4;
  background: var(--panel-glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); display: grid; grid-template-rows: auto 1fr; min-height: 0; overflow: hidden; }
nav.tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
nav.tabs button { border: 0; background: transparent; padding: 6px 10px; font: 500 12.5px/1 var(--f-body); color: var(--ink-2); border-radius: 999px; position: relative; white-space: nowrap; }
nav.tabs button:hover { background: var(--panel-2); color: var(--ink); }
nav.tabs button[aria-selected="true"] { background: var(--ink); color: var(--panel); }
nav.tabs .dot { position: absolute; top: 2px; right: 2px; width: 7px; height: 7px; border-radius: 50%; background: var(--crit); }
.pane { overflow-y: auto; min-height: 0; padding: 16px 18px 40px; display: grid; gap: 18px; align-content: start; grid-auto-rows: max-content; scrollbar-width: thin; }
.pane > * { min-width: 0; }

@media (max-width: 1100px) { .side { width: 430px; } .map-legend { max-width: calc(100% - 470px); } }
@media (max-width: 900px) {
  body { overflow: auto; }
  #app { height: auto; min-height: 100%; }
  main.body { display: grid; }
  .mapwrap { position: relative; height: 46vh; min-height: 280px; }
  .side { position: static; width: auto; border-radius: 0; border: 0; border-top: 1px solid var(--line); box-shadow: none; background: var(--panel); backdrop-filter: none; }
  .pane { overflow: visible; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .kpis { margin-left: 0; width: 100%; gap: 16px; }
  .date { min-width: 0; }
  header.top { gap: 10px; }
  .map-legend { max-width: calc(100% - 24px); }
  .plane-card { width: auto; right: 12px; top: auto; bottom: 12px; }
}
@media (max-width: 600px) {
  .map-legend { display: none; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid3 { grid-template-columns: 1fr; }
  .specs { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .kpi b { font-size: 13px; }
  .plane-card .acv { display: none; }
}

/* ---------- Karte ---------- */
.land { fill: var(--land); stroke: var(--coast); stroke-width: .6; vector-effect: non-scaling-stroke; }
.borders { fill: none; stroke: var(--border); stroke-width: .6; opacity: .9; vector-effect: non-scaling-stroke; }
#map { touch-action: none; cursor: grab; } #map:active { cursor: grabbing; }
.rt, .trail { vector-effect: non-scaling-stroke; }
.apt .hit { fill: transparent; }
.grat { display: none; }
.rt { fill: none; stroke-linecap: round; }
.rt.ai { stroke-width: 1; opacity: .26; }
.rt.me { stroke: var(--accent); stroke-width: 1.5; opacity: .5; }
.rt.me.wait { stroke-dasharray: 4 5; opacity: .45; }
.rt.draft { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5 5; opacity: .95; }
.rt.hl { stroke-width: 3; opacity: 1; }
.trail { fill: none; stroke: var(--trail); stroke-width: 2.2; stroke-linecap: round; opacity: .8; }
.trail.ai { stroke: var(--plane-ai); stroke-width: 1.6; opacity: .55; }
.trail.sel { stroke: var(--crit); opacity: .95; stroke-width: 2.6; }
.apt circle.ring { fill: var(--panel); stroke: var(--ink-2); stroke-width: 1.4; }
.apt.mine circle.ring { stroke: var(--accent); stroke-width: 2; }
.apt.base circle.ring { fill: var(--accent); stroke: var(--plane-edge); stroke-width: 1.4; }
.apt.sel circle.ring { stroke: var(--accent); stroke-width: 3; }
.apt text { font: 600 11.5px var(--f-body); letter-spacing: .04em; fill: var(--ink); paint-order: stroke; stroke: var(--land); stroke-width: 3px; stroke-linejoin: round; }
.apt text.city { font: 400 10px var(--f-body); letter-spacing: 0; fill: var(--ink-3); }
.apt { cursor: pointer; }
.apt:hover circle.ring { stroke-width: 2.6; }
.apt .halo { fill: none; stroke-width: 2; opacity: 0; stroke-dasharray: 3 3; }
.apt.evbad .halo { stroke: var(--crit); opacity: .95; }
.apt.evgood .halo { stroke: var(--good); opacity: .95; }
.plane { cursor: pointer; }
.plane path { fill: var(--plane-ai); stroke: rgba(0,0,0,.5); stroke-width: .5; }
.plane.me path { fill: var(--plane); stroke: var(--plane-edge); stroke-width: .6; }
.plane.sel path { fill: var(--crit); stroke: #000; }
.plane circle { fill: transparent; }
.map-legend { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 14px; background: var(--panel-glass); backdrop-filter: blur(8px);
  border: 1px solid var(--line); border-radius: var(--r); padding: 8px 12px; font-size: 11.5px; color: var(--ink-2); display: grid; gap: 4px; max-width: calc(100% - 520px); }
.map-legend .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.map-legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.map-legend i.dot { width: 9px; height: 9px; border-radius: 50%; border: 2px dashed; background: none; }
.map-legend i.dot.crit { border-color: var(--crit); } .map-legend i.dot.good { border-color: var(--good); }
.map-tools { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); top: 12px; display: flex; gap: 6px; }
.map-tools button { background: var(--panel-glass); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 12px; color: var(--ink-2); box-shadow: var(--shadow); }
.map-tools button:hover { color: var(--ink); }
.map-tools .zoom { display: inline-flex; gap: 0; background: var(--panel-glass); border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow); overflow: hidden; }
.map-tools .zoom button { border: 0; border-radius: 0; box-shadow: none; background: transparent; padding: 6px 11px; }
.map-tools .zoom button + button { border-left: 1px solid var(--line); }
.daybar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; }
.daybar div { height: 100%; background: var(--accent); width: 0; }
.plane-card { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); top: 54px; width: 290px; background: var(--panel-glass); backdrop-filter: blur(10px);
  border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; z-index: 3; }
.pc-head { background: var(--accent); color: var(--on-accent); padding: 9px 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pc-head.ai { background: var(--ink); color: var(--panel); }
.pc-head b { font: 700 15px/1 var(--f-body); letter-spacing: .02em; }
.pc-head small { display: block; font-size: 11px; opacity: .8; margin-top: 2px; }
.pc-head button { border: 0; background: transparent; color: inherit; font-size: 18px; line-height: 1; padding: 2px 4px; }
.plane-card .acv { background: var(--sky); padding: 4px 10px 0; }
.pc-route { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 12px 12px 8px; gap: 8px; }
.pc-route div { display: grid; } .pc-route div:last-child { text-align: right; }
.pc-route b { font: 700 22px/1 var(--f-body); letter-spacing: .02em; }
.pc-route span { font-size: 11px; color: var(--ink-3); }
.pc-route i { color: var(--accent-ink); font-style: normal; font-size: 16px; }
.pc-prog { margin: 0 12px; height: 4px; background: var(--panel-2); border-radius: 2px; overflow: hidden; }
.pc-prog i { display: block; height: 100%; background: var(--accent); }
.pc-times { display: flex; justify-content: space-between; padding: 4px 12px 0; font: 500 11px var(--f-mono); color: var(--ink-3); }
.plane-card dl { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); margin: 10px 0 0; border-top: 1px solid var(--line); }
.plane-card dl div { background: var(--panel); padding: 7px 12px; }
.plane-card dt { font-size: 10.5px; color: var(--ink-3); } .plane-card dd { margin: 0; font: 500 12.5px var(--f-mono); }

/* Flugzeug-Illustrationen */
.acv { display: block; width: 100%; height: auto; }
.acv-box { background: var(--sky); border-radius: var(--r); padding: 6px 10px 2px; }
.thumb { width: 104px; flex: none; background: var(--sky); border-radius: 6px; padding: 2px 4px; }
.acrow { display: flex; gap: 10px; align-items: center; }

/* ---------- Bausteine ---------- */
h2.sec { font: 600 15px/1.2 var(--f-body); margin: 0; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
h2.sec small { font: 400 12px var(--f-body); color: var(--ink-3); }
h3 { font: 600 13.5px/1.3 var(--f-body); margin: 0; }
p { margin: 0; }
.muted { color: var(--ink-3); } .ink2 { color: var(--ink-2); }
.small { font-size: 12px; }
.stack { display: grid; gap: 10px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--panel-2); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.tile span { font-size: 11px; color: var(--ink-3); }
.tile b { font: 500 15px/1.25 var(--f-mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tile em { font-style: normal; font-size: 11px; color: var(--ink-3); }
.pos { color: var(--good); } .neg { color: var(--crit); } .warnc { color: var(--warn); }
.btn { border: 1px solid var(--line-2); background: transparent; border-radius: 999px; padding: 7px 14px; font-weight: 500; font-size: 12.5px; }
.btn:hover { border-color: var(--ink-3); background: var(--panel-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn.danger { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 40%, var(--line-2)); }
.btn.small { padding: 4px 11px; font-size: 12px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.seg { display: inline-flex; background: var(--panel-2); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 5px 11px; font-size: 12px; color: var(--ink-2); border-radius: 999px; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.18); font-weight: 600; }
.seg.wrap { flex-wrap: wrap; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 6px; }
.opts button { border: 1px solid var(--line); background: var(--panel-2); border-radius: var(--r); padding: 8px 10px; text-align: left; display: grid; gap: 2px; font-size: 12.5px; }
.opts button b { font-weight: 600; } .opts button span { color: var(--ink-3); font-size: 11.5px; font-family: var(--f-mono); }
.opts button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.chk { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; } .chk input { margin-top: 3px; flex: none; }
label.f { display: grid; gap: 4px; font-size: 12px; color: var(--ink-2); min-width: 0; }
label.f > span { font-size: 11px; color: var(--ink-3); }
input[type="number"], input[type="text"], select { border: 1px solid var(--line-2); background: var(--panel); border-radius: var(--r); padding: 7px 9px; width: 100%; min-width: 0; }
input[type="number"] { font-family: var(--f-mono); }
input[type="checkbox"] { accent-color: var(--accent); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.card { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--panel); }
.card.pad { padding: 14px; }
.callout { border-radius: var(--r); padding: 10px 12px; font-size: 12.5px; display: grid; gap: 4px; background: var(--panel-2); }
.callout.warn { background: var(--warn-soft); box-shadow: inset 3px 0 0 var(--warn); }
.callout.crit { background: var(--crit-soft); box-shadow: inset 3px 0 0 var(--crit); }
.callout.good { background: var(--good-soft); box-shadow: inset 3px 0 0 var(--good); }
.callout.info { box-shadow: inset 3px 0 0 var(--ink-3); }
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 99px; padding: 2px 8px; font-size: 11px; font-weight: 500; background: var(--panel-2); color: var(--ink-2); white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); } .chip.warn { background: var(--warn-soft); color: var(--warn); } .chip.crit { background: var(--crit-soft); color: var(--crit); }
.chip.me { background: var(--accent-soft); color: var(--accent-ink); }
.sw { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
