nav.main button[aria-selected="true"] .ic { background: var(--sc); color: #fff; box-shadow: 0 0 16px color-mix(in srgb, var(--sc) 60%, transparent); }
nav.main .dot { position: absolute; top: 8px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: #fb7185; }
.topright { margin-left: auto; display: flex; align-items: center; gap: 14px; padding-left: 14px; }

.calpop { position: fixed; z-index: 69; top: calc(var(--hh, 64px) + 6px); left: 12px; width: min(400px, calc(100vw - 24px)); max-height: calc(100dvh - var(--hh, 64px) - 24px); overflow: auto; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 14px; display: grid; gap: 12px; }

.iconbtn .dot { position: absolute; top: 6px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: #fb7185; border: 2px solid var(--bar); }
.avatar-btn { border: 0; width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #22d3ee, #2f7cf6); color: #04122a; font: 800 13px var(--f-body); }
.usermenu { position: absolute; right: 12px; top: 58px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 6px; display: grid; min-width: 200px; z-index: 20; }

.usermenu button:hover { background: var(--panel-2); }

main.body { display: grid; grid-template-columns: 300px minmax(0, 1fr) var(--rw, 520px); gap: 12px; padding: 12px; min-height: 0; }
.rcol { position: relative; display: flex; flex-direction: column; gap: 8px; min-height: 0; min-width: 0; container-type: inline-size; }
.rcol > .side { flex: 1 1 auto; }

.resizer::after { content: ""; position: absolute; left: 4px; top: 50%; width: 4px; height: 44px; margin-top: -22px; border-radius: 3px; background: var(--line-2, var(--line)); opacity: .7; transition: opacity .15s, background .15s; }
.resizer:hover::after, .resizer.drag::after, .resizer:focus-visible::after { opacity: 1; background: var(--accent); }

/* Passen nicht alle Bereiche mit Beschriftung in die Leiste, zeigt sie nur noch die Symbole – alle bleiben sichtbar (Klasse setzt fitNav) */
nav.main.ico button span.lbl, nav.main.ico button[aria-selected="true"] span.lbl { display: none; }

.card2 { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); }
#sidebar { display: grid; gap: 12px; align-content: start; overflow-y: auto; min-height: 0; scrollbar-width: thin; }
.alcard { padding: 14px; display: flex; gap: 12px; align-items: center; }
.albadge { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font: 800 16px var(--f-body); color: var(--on-accent); background: linear-gradient(135deg, var(--accent-2), var(--accent)); flex: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }

.alcard span { font-size: 12px; color: var(--ink-3); }
.kpilist { display: grid; }
.kpilist > div { padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; border-bottom: 1px solid var(--line); }
.kpilist > div:last-child { border-bottom: 0; }
.kpilist span { font-size: 12px; color: var(--ink-3); }
.kpilist b { font: 600 17px var(--f-mono); grid-column: 1; }
.kpilist em { grid-column: 2; grid-row: 1 / span 2; align-self: center; font: 600 12px var(--f-mono); font-style: normal; }
.kpilist em.up { color: var(--good); } .kpilist em.down { color: var(--crit); }
.assist { padding: 14px; display: grid; gap: 10px; }
.assist-h { display: flex; gap: 10px; align-items: center; }
.assist-h .av { width: 42px; height: 42px; flex: none; }
.assist-h b { display: block; font-size: 14px; } .assist-h span { font-size: 11.5px; color: var(--ink-3); }
.hints { display: grid; gap: 8px; }
.hint { display: grid; grid-template-columns: 10px 1fr; gap: 9px; font-size: 12.5px; line-height: 1.45; color: var(--ink-2); }
.hint i { width: 9px; height: 9px; border-radius: 50%; margin-top: 5px; background: var(--c-karte); box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 0%, transparent); }
.hint.crit i { background: var(--crit); } .hint.warn i { background: var(--warn); } .hint.good i { background: var(--good); } .hint.info i { background: var(--c-karte); }
.hint b { color: var(--ink); font-weight: 600; }
.hint button { margin-top: 4px; }

.mapwrap { position: relative; background: var(--sea); overflow: hidden; border-radius: var(--r-lg); border: 1px solid var(--line); box-shadow: var(--shadow); min-height: 0; }
.mapwrap svg#map { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; transform-origin: 0 0; will-change: transform; }
.mapwrap canvas#mapPlanes { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
.side { --sec: var(--c-karte); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); display: grid; grid-template-rows: auto auto 1fr; min-height: 0; overflow: hidden; }
.side[data-sec="flotte"] { --sec: var(--c-flotte); } .side[data-sec="strecken"] { --sec: var(--c-strecken); } .side[data-sec="finanzen"] { --sec: var(--c-finanzen); }
.side[data-sec="markt"] { --sec: var(--c-markt); } .side[data-sec="unternehmen"] { --sec: var(--c-unternehmen); } .side[data-sec="cargo"] { --sec: var(--c-cargo); }
.cgl { display: grid; gap: 8px; }
.cgr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel, transparent); }
.cgr.sel { border-color: var(--c-cargo); } .cgr.weak { opacity: .72; }
.cgr .cgt { min-width: 0; } .cgr .cgt b { font-size: 14.5px; } .cgr .m { color: var(--ink-3, var(--ink-2)); font-size: 12.5px; font-weight: 400; }
.cgr .act { grid-column: 2; grid-row: 1; align-self: start; }
.cgr .v { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 13px; font-variant-numeric: tabular-nums; }
.dly { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 16px; align-items: center; margin-bottom: 14px; } .dly-pack { filter: drop-shadow(0 0 16px rgba(217,70,239,.45)); animation: pkFloat 2.4s ease-in-out infinite; }
.cgreq { display: flex; flex-wrap: wrap; gap: 4px; width: 100%; margin-top: 2px; } .cgreq .chip { font-size: 11.5px; }
.chip.bad { background: var(--crit-soft); color: var(--crit); }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(32px, 1fr)); gap: 8px; max-width: 560px; }
.swc { all: unset; display: block; width: 100%; box-sizing: border-box; aspect-ratio: 1 / 1; border-radius: 50%; background: var(--c); cursor: pointer; border: 2px solid transparent; box-shadow: 0 0 0 1px color-mix(in srgb, var(--ink) 15%, transparent) inset; position: relative; min-height: 30px; }
.swc:hover { transform: scale(1.08); } .swc:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.swc.on { border-color: var(--ink); box-shadow: 0 0 0 3px var(--panel) inset, 0 0 12px var(--c); }
.swc.taken { cursor: not-allowed; opacity: .35; } .swc.taken::after { content: ''; position: absolute; left: 12%; right: 12%; top: 50%; height: 2px; background: var(--ink); transform: rotate(-45deg); }
.pa-offers { display: grid; gap: 6px; } .pa-of { display: grid; grid-template-columns: minmax(120px, 1fr) 84px 96px auto 92px; gap: 8px; align-items: end; padding: 8px; border: 1px solid var(--line); border-radius: 10px; } .pa-of input:not([type=checkbox]) { width: 100%; min-width: 0; }
.pa-of .pa-on { display: flex; gap: 6px; align-items: center; min-height: 36px; white-space: nowrap; font-size: 13px; } .pa-of .pa-x, .pa-of [data-pa=ofdel] { align-self: center; } @media (max-width: 600px) { .pa-of { grid-template-columns: 1fr 1fr; } .pa-of label.f:first-child { grid-column: 1 / -1; } }
.adm-bar { display: flex; flex-wrap: wrap; gap: 8px; } .adm-bar .badge { margin-left: 6px; background: var(--crit); color: #fff; border-radius: 999px; font-size: 11px; padding: 0 6px; min-width: 18px; text-align: center; }
.chip.cgc { background: color-mix(in srgb, var(--c-cargo) 16%, transparent); color: var(--c-cargo); }
.rt.cg { stroke: var(--c-cargo); stroke-dasharray: 5 4; fill: none; stroke-width: 1.2; vector-effect: non-scaling-stroke; } .rt.cgai { stroke-dasharray: 3 4; opacity: .4; fill: none; stroke-width: .7; vector-effect: non-scaling-stroke; }
.sechead { display: flex; align-items: center; gap: 12px; padding: 14px 16px 12px; background: linear-gradient(120deg, color-mix(in srgb, var(--sec) 26%, transparent), transparent 75%); border-bottom: 1px solid var(--line); }
.sechead .secic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--sec); color: #fff; flex: none; box-shadow: 0 6px 18px color-mix(in srgb, var(--sec) 40%, transparent); }
.sechead .secic svg.ic { width: 21px; height: 21px; }
.sechead b { display: block; font-size: 16px; } .sechead span { font-size: 12px; color: var(--ink-3); }
nav.tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
nav.tabs button { border: 1px solid transparent; background: transparent; padding: 6px 12px; font: 500 12.5px/1 var(--f-body); color: var(--ink-2); border-radius: 999px; position: relative; white-space: nowrap; }
nav.tabs button:hover { background: color-mix(in srgb, var(--sec) 10%, transparent); color: var(--ink); }
nav.tabs button[aria-selected="true"] { background: var(--sec); color: #fff; }
nav.tabs .dot { position: absolute; top: 1px; right: 1px; width: 7px; height: 7px; border-radius: 50%; background: var(--crit); }
.pane { overflow-y: auto; min-height: 0; padding: 16px 18px 40px; display: grid; gap: 18px; align-content: start; grid-auto-rows: max-content; scrollbar-width: thin; }
.pane > * { min-width: 0; }
.side .btn.primary { background: var(--sec); border-color: var(--sec); color: #fff; }
.side .btn.primary:hover { filter: brightness(1.08); }
.side h2.sec::before { content: ""; display: inline-block; width: 4px; height: 15px; border-radius: 2px; background: var(--sec); margin-right: 8px; vertical-align: -2px; }
.side .tile { border-top: 3px solid color-mix(in srgb, var(--sec) 55%, transparent); }
.only-narrow { display: none; }

@media (max-width: 1280px) {
  main.body { grid-template-columns: minmax(0, 1fr) var(--rw, 480px); }
  #sidebar { display: none; }
  .only-narrow { display: grid; }
}
@media (max-width: 900px) {
  /* Die Seite selbst scrollt nicht, nur #app: So bleibt das Fenster für den Browser still, und iOS-Safari verschiebt die feste Leiste unten beim Scrollen nicht mehr */
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  #app { display: block; height: 100%; height: 100dvh; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }
  header.top { flex-wrap: wrap; padding-top: 8px; }
  .logo { padding-right: 10px; }
  .logo .wm span { display: none; }
  .topright { gap: 8px; }
  main.body { grid-template-columns: 1fr; padding: 8px; }
  .resizer { display: none; }
  nav.main { position: sticky; top: 0; z-index: 4; }
  .mapwrap { height: 48vh; min-height: 300px; }
  .pane { overflow: visible; }
  .side { overflow: visible; }
  .date b { display: none; }
  .date .d-day { display: none; } .date .d-date { display: inline; }
}
@media (max-width: 600px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid3 { grid-template-columns: 1fr; }
  .specs { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .speed select { max-width: 92px; }
  .logo .wm b { font-size: 16px; }
  .map-legend, .activebox { display: none; }
  .plane-card .acv { display: none; }
}

/* ---------- Karte ---------- */
.land { fill: var(--land); stroke: var(--coast); stroke-width: .6; vector-effect: non-scaling-stroke; }
.borders { fill: none; stroke: var(--border); stroke-width: .6; opacity: .9; vector-effect: non-scaling-stroke; }
#map { touch-action: none; cursor: grab; } #map:active { cursor: grabbing; }
.rt, .trail { vector-effect: non-scaling-stroke; fill: none; stroke-linecap: round; }
.rt.ai { stroke-width: .7; opacity: .2; }
.rt.meglow { stroke: var(--mine, var(--accent)); stroke-width: 3.5; opacity: .1; }
.rt.me { stroke: var(--mine, var(--accent)); stroke-width: 1.1; opacity: .8; }
.rt.me.wait { stroke-dasharray: 4 5; opacity: .55; }
.rt.huglow { display: none; }
.rt.hu { stroke-width: .8; opacity: .3; }
.rt.draft { stroke: var(--c-strecken); stroke-width: 2.2; stroke-dasharray: 6 5; opacity: .95; }
.rt.hl { stroke-width: 3; opacity: 1; }
.trail { stroke: var(--trail); stroke-width: 2.2; opacity: .85; }
.trail.sel { stroke: #22d3ee; opacity: 1; stroke-width: 2.6; }
.apt .hit { fill: transparent; }
.apt .glowc { fill: var(--glow); }
.apt circle.ring { fill: var(--panel); stroke: var(--ink-2); stroke-width: 1.3; }
.apt.mine circle.ring { stroke: var(--accent); stroke-width: 2; }
.apt.base circle.ring { fill: var(--accent); stroke: var(--plane-edge); stroke-width: 1.4; }
.apt.sel circle.ring { stroke: #22d3ee; stroke-width: 3; }
.apt text { font: 700 11.5px var(--f-body); letter-spacing: .05em; fill: var(--ink); paint-order: stroke; stroke: var(--sea); stroke-width: 3px; stroke-linejoin: round; }
.apt text.city { font: 400 10px var(--f-body); letter-spacing: 0; fill: var(--ink-3); }
.apt { cursor: pointer; }
.apt:hover circle.ring { stroke-width: 2.6; }
.apt .halo { fill: none; stroke-width: 2; opacity: 0; stroke-dasharray: 3 3; }
.apt.evbad .halo { stroke: var(--crit); opacity: .95; }
.apt.evgood .halo { stroke: var(--good); opacity: .95; }

.pk-equip { z-index: 3; display: grid; gap: 6px; justify-items: center; text-align: center; } .pk-stage.reveal .pk-equip { opacity: 0; transition: opacity .4s .6s; } .pk-stage.reveal.flipped .pk-equip { opacity: 1; }
.pk-ov .btn.gold { color: #1a1204; background: linear-gradient(120deg, #f5b301, #ffe08a); border-color: #f5b301; font-weight: 700; } .pk-eqok { color: #86efac; font-weight: 700; text-shadow: 0 0 10px rgba(34,197,94,.5); }
.pk-stage.reveal .pk-btns { opacity: 0; transition: opacity .4s .6s; } .pk-stage.reveal.flipped .pk-btns { opacity: 1; }
.pk-ov .btn { color: #e6edf7; border-color: #2b3c6a; } .pk-ov .btn.primary { color: #04122a; background: #22d3ee; border-color: #22d3ee; }
.pk-stage.sum { align-content: center; } .pk-stage.sum h2 { margin: 0; font-size: 26px; text-shadow: 0 0 18px var(--rc); }
.pk-sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; width: 100%; }
.pk-mini { display: grid; gap: 4px; justify-items: center; text-align: center; padding: 10px; border-radius: 14px; background: #0e1832; border: 1.5px solid var(--rc); box-shadow: 0 0 18px color-mix(in srgb, var(--rc) 35%, transparent); } .pk-mini img { width: 100%; } .pk-mini span { font-size: 11px; color: #a5b4d0; }
@keyframes pkFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
@keyframes pkShake { 0% { transform: translate(0, 0) rotate(0); } 25% { transform: translate(-3px, 1px) rotate(-1.2deg); } 50% { transform: translate(3px, -1px) rotate(1.2deg); } 75% { transform: translate(-1px, -2px) rotate(-.6deg); } 100% { transform: translate(0, 0) rotate(0); } }
@keyframes pkFlash { 0% { opacity: 0; transform: scale(.4); } 20% { opacity: 1; } 100% { opacity: 0; transform: scale(1.3); } }
@keyframes pkPart { 0% { opacity: 1; transform: rotate(var(--a)) translateX(0) scale(1); } 100% { opacity: 0; transform: rotate(var(--a)) translateX(var(--d)) scale(.3); } }
@keyframes pkRays { to { transform: rotate(360deg); } } @keyframes pkIn { to { opacity: 1; } }
@keyframes pkCard { from { transform: scale(.5) translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
/* Tausch */
.tr-card { gap: 8px; } .tr-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.tr-items { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.tr-build { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.tr-pool { display: flex; flex-wrap: wrap; gap: 6px; max-height: 260px; overflow: auto; padding: 6px 0; }
/* 0.21.81 Skin-Börse */
.ac-mini.on { outline: 2px solid var(--accent); outline-offset: 1px; background: var(--accent-soft); }
.mk-card .mk-bid { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: grid; gap: 6px; background: var(--panel-2); }
.mk-bid.won { border-color: var(--good); } .mk-bid.lost, .mk-bid.withdrawn, .mk-bid.void { opacity: .65; }
.mb-game { border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.mb-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; } .mb-row input { width: 96px; }
@media (max-width: 600px) { .sh-hero { grid-template-columns: 72px minmax(0, 1fr); gap: 10px; } .sh-hero h2 { font-size: 16px; } .ac-grid { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 8px; } .pk-stage { min-height: min(560px, 88vh); } .pk-box { width: min(270px, 70vw, 50vh); } .pk-card h2 { font-size: 22px; } .pk-back { min-height: 220px; } }
@media (prefers-reduced-motion: reduce) { .sh-dark::before, .sh-pack, .ac-card.rar-l, svg .sk-shine, .pk-bg i, .pk-bgrays, .pk-halo { animation: none !important; } }
